name: Publish Docker image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - packaging/docker/**
      - .github/workflows/publish-docker.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download and verify Debian release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v4.8.5-smap --repo "$GITHUB_REPOSITORY" \
            --pattern FB-Mod_by_SMAP_4.8.5_amd64.deb --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/payload"
          cd "$RUNNER_TEMP/payload"
          grep '  FB-Mod_by_SMAP_4.8.5_amd64.deb$' SHA256SUMS | sha256sum --check --strict
          cp FB-Mod_by_SMAP_4.8.5_amd64.deb "$GITHUB_WORKSPACE/packaging/docker/filebot.deb"
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:4.8.5" --tag "$image:latest" packaging/docker
          docker push "$image:4.8.5"
          docker push "$image:latest"
