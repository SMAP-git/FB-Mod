name: Publish Docker image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download and verify Debian release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^application.version: *//p' app.properties)"
          deb="FB-Mod_by_SMAP_${version}_amd64.deb"
          gh release download "v${version}-smap" --repo "$GITHUB_REPOSITORY" \
            --pattern "$deb" --pattern SHA256SUMS \
            --dir "$RUNNER_TEMP/payload"
          cd "$RUNNER_TEMP/payload"
          grep "  ${deb}\$" SHA256SUMS | sha256sum --check --strict
          cp "$deb" "$GITHUB_WORKSPACE/packaging/docker/filebot.deb"
      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$(sed -n 's/^application.version: *//p' app.properties)"
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$version" --tag "$image:latest" packaging/docker
          docker push "$image:$version"
          docker push "$image:latest"
